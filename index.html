// ---- MATCH CARD ----
function MatchCard({m,open,onToggle}){
  const odds=[{l:"1",v:m.home_odds},...(m.draw_odds?[{l:"X",v:m.draw_odds}]:[]),{l:"2",v:m.away_odds}];
  return(
    <div onClick={onToggle} style={{background:`linear-gradient(135deg,${C.card},#131323)`,borderRadius:12,border:`1px solid ${open?C.red:C.border}`,marginBottom:10,overflow:"hidden",cursor:"pointer",transition:"border-color .2s",animation:"slideUp .3s ease"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 13px 4px"}}>
        <div style={{display:"flex",alignItems:"center",gap:6}}>
          <span style={{background:SC[m.sport]+"33",color:SC[m.sport],border:`1px solid ${SC[m.sport]}55`,fontSize:8,padding:"2px 7px",borderRadius:3,letterSpacing:2,fontFamily:"monospace"}}>{SE[m.sport]} {m.sport?.toUpperCase()}</span>
          <span style={{color:C.gold,fontSize:10,letterSpacing:2,fontFamily:"monospace"}}>{m.league}</span>
        </div>
        <span style={{color:C.muted,fontSize:10,fontFamily:"monospace"}}>🕐 {m.match_time} — {fmt(m.match_date)}</span>
      </div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"4px 13px 8px"}}>
        <div style={{flex:1,textAlign:"center"}}>
          <span style={{fontSize:22,display:"block",marginBottom:2}}>{m.home_logo||"🔴"}</span>
          <span style={{color:"#fff",fontSize:12,letterSpacing:1}}>{m.home_team}</span>
        </div>
        <span style={{color:C.red,fontSize:16,margin:"0 6px"}}>VS</span>
        <div style={{flex:1,textAlign:"center"}}>
          <span style={{fontSize:22,display:"block",marginBottom:2}}>{m.away_logo||"🔵"}</span>
          <span style={{color:"#fff",fontSize:12,letterSpacing:1}}>{m.away_team}</span>
        </div>
      </div>
      <div style={{display:"flex",borderTop:`1px solid ${C.border}`}}>
        {odds.map((o,i)=>(
          <div key={i} style={{flex:1,textAlign:"center",padding:"7px 3px",borderRight:i<odds.length-1?`1px solid ${C.border}`:"none"}}>
            <span style={{fontSize:8,color:"#444",letterSpacing:2,fontFamily:"monospace",display:"block"}}>{o.l}</span>
            <span style={{fontSize:15,color:C.gold,display:"block",marginTop:2}}>{o.v??"—"}</span>
          </div>
        ))}
      </div>
      {open&&m.prediction&&(
        <div onClick={e=>e.stopPropagation()} style={{background:"linear-gradient(135deg,#0a1008,#111f11)",border:"1px solid #1e3a1e",borderRadius:10,padding:13,margin:"0 12px 12px"}}>
          <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:9}}>
            <div style={{width:7,height:7,background:"#4caf50",borderRadius:"50%",animation:"pulse 2s infinite"}}/>
            <span style={{color:"#4caf50",fontSize:9,letterSpacing:3,fontFamily:"monospace"}}>PRONOSTIC OFFICIEL PICSOUSBET</span>
          </div>
          <div style={{display:"flex",alignItems:"center",marginBottom:8,gap:10}}>
            <span style={{fontSize:17,color:"#fff",letterSpacing:1}}>{m.prediction.toUpperCase()}</span>
            {m.confidence&&(
              <div style={{flex:1}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
                  <span style={{fontSize:8,color:C.muted,fontFamily:"monospace",letterSpacing:2}}>CONFIANCE</span>
                  <span style={{fontSize:8,color:C.gold,fontFamily:"monospace",letterSpacing:2}}>{m.confidence}%</span>
                </div>
                <div style={{height:4,background:"#1a1a2a",borderRadius:2,overflow:"hidden"}}>
                  <div style={{height:"100%",width:`${Math.min(m.confidence,100)}%`,background:m.confidence>80?"#4caf50":m.confidence>65?C.gold:C.red,borderRadius:2,transition:"width 1s"}}/>
                </div>
              </div>
            )}
          </div>
          {m.predicted_score&&<div style={{background:"#050a05",borderRadius:6,padding:"4px 10px",textAlign:"center",marginBottom:7,display:"inline-block"}}><span style={{fontSize:8,color:"#444",letterSpacing:2,fontFamily:"monospace"}}>SCORE PRÉDIT</span><span style={{fontSize:19,color:C.gold,letterSpacing:4,display:"block"}}>{m.predicted_score}</span></div>}
          {m.reasoning&&<p style={{fontSize:10,color:C.muted,fontFamily:"monospace",lineHeight:1.6,borderLeft:`2px solid ${C.red}`,paddingLeft:8,marginTop:7}}>{m.reasoning}</p>}
          {m.tip&&<div style={{background:"rgba(229,69,96,.08)",border:"1px solid rgba(229,69,96,.25)",borderRadius:5,padding:"5px 9px",marginTop:7}}><span style={{fontSize:10,color:C.red,fontFamily:"monospace"}}>💡 {m.tip}</span></div>}
          {m.stars&&<Stars n={Number(m.stars)}/>}
        </div>
      )}
    </div>
  );
}

// ---- ARTICLE READER ----
function ArticleReader({article,all,onBack}){
  const [cur,setCur]=useState(article);
  const idx=all.findIndex(a=>a.id===cur.id);
  const prev=all[idx+1]||null; const next=all[idx-1]||null;
  useEffect(()=>window.scrollTo(0,0),[cur.id]);
  return(
    <div style={{padding:"14px 14px 120px",animation:"slideUp .3s ease"}}>
      <div onClick={onBack} style={{display:"flex",alignItems:"center",gap:6,color:C.red,fontSize:11,fontFamily:"monospace",cursor:"pointer",marginBottom:16,letterSpacing:2}}>← RETOUR AUX ARTICLES</div>

        {(cur.tags||[]).map((t,i)=><span key={i} style={{background:C.blue+"22",color:C.blue,border:`1px solid ${C.blue}44`,borderRadius:4,padding:"2px 8px",fontSize:9,fontFamily:"monospace",letterSpacing:1}}>{t}</span>)}
        <span style={{background:"#55555522",color:C.muted,border:"1px solid #44444444",borderRadius:4,padding:"2px 8px",fontSize:9,fontFamily:"monospace",letterSpacing:1}}>⏱ {cur.read_time} min</span>
        <span style={{background:"#22222222",color:C.dim,border:"1px solid #33333344",borderRadius:4,padding:"2px 8px",fontSize:9,fontFamily:"monospace",letterSpacing:1}}>{fmt(cur.created_at)}</span>

      {cur.intro&&<p style={{fontSize:14,color:"#ccc",lineHeight:1.8,marginBottom:14,borderLeft:`3px solid ${C.red}`,paddingLeft:12,fontFamily:"sans-serif"}}>{cur.intro}</p>}
      {cur.body&&cur.body.split("\n").filter(Boolean).map((p,i)=><p key={i} style={{fontSize:13,color:C.muted,lineHeight:1.8,marginBottom:14,fontFamily:"sans-serif"}}>{p}</p>)}
      {cur.conclusion&&<p style={{fontSize:13,color:"#ccc",lineHeight:1.8,fontStyle:"italic",fontFamily:"sans-serif",borderTop:`1px solid ${C.border}`,paddingTop:14,marginTop:6}}>{cur.conclusion}</p>}
      <div style={{display:"flex",gap:10,marginTop:20,marginBottom:4}}>
        {prev?<div onClick={()=>setCur(prev)} style={{flex:1,background:C.card,border:`1px solid ${C.border}`,borderRadius:8,padding:"10px 12px",cursor:"pointer",color:C.muted,fontSize:10,fontFamily:"monospace",letterSpacing:1,textAlign:"left"}}>← PRÉCÉDENT<br/><span style={{color:"#fff",fontSize:11,letterSpacing:0}}>{prev.title.substring(0,45)}...</span></div>:<div style={{flex:1}}/>}
        {next?<div onClick={()=>setCur(next)} style={{flex:1,background:C.card,border:`1px solid ${C.border}`,borderRadius:8,padding:"10px 12px",cursor:"pointer",color:C.muted,fontSize:10,fontFamily:"monospace",letterSpacing:1,textAlign:"right"}}>SUIVANT →<br/><span style={{color:"#fff",fontSize:11,letterSpacing:0}}>{next.title.substring(0,45)}...</span></div>:<div style={{flex:1}}/>}
      </div>
      <CTA title="🎯 PASSEZ À L'ACTION" sub="UTILISEZ NOS PRONOSTICS SUR 1XBET"/>
    </div>
  );
}

// ---- MAIN APP ----
function App(){
  const [tab,setTab]=useState("matches");
  const [sport,setSport]=useState("all");
  const [open,setOpen]=useState(null);
  const [matches,setMatches]=useState([]);
  const [coupons,setCoupons]=useState([]);
  const [articles,setArticles]=useState([]);
  const [loading,setLoading]=useState(true);
  const [openArt,setOpenArt]=useState(null);

  useEffect(()=>{
    async function load(){
      setLoading(true);
      try{
        const [m,c,a]=await Promise.all([dbGet("matches"),dbGet("coupons"),dbGet("articles","&status=eq.published")]);
        setMatches(m||[]);setCoupons(c||[]);setArticles(a||[]);
      }catch(e){console.error(e);}
      setLoading(false);
    }
    load();const iv=setInterval(load,60000);return()=>clearInterval(iv);
  },[]);

  const filtered=sport==="all"?matches:matches.filter(m=>m.sport===sport);
  const recent=coupons.filter(c=>daysAgo(c.match_date||c.created_at)<=3);

  const navItems=[{id:"matches",i:"🏟️",l:"MATCHS"},{id:"results",i:"🏆",l:"RÉSULTATS"},{id:"articles",i:"📰",l:"ARTICLES"},{id:"promo",i:"🎁",l:"BONUS"}];

        <WAButton/>

    );

  return(
    <div style={{background:C.bg,maxWidth:430,margin:"0 auto",minHeight:"100vh",overflowX:"hidden"}}>
      {/* HEADER */}
      <div style={{background:"linear-gradient(160deg,#0d0d1f,#111128,#0a1628)",padding:"18px 14px 12px",borderBottom:`2px solid ${C.red}`,position:"sticky",top:0,zIndex:100}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <div style={{width:38,height:38,borderRadius:10,background:`linear-gradient(135deg,${C.red},${C.gold})`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20}}>⚡</div>
            <div>
              <span style={{fontSize:24,color:"#fff",letterSpacing:3}}>PicsousBet</span>
              <span style={{fontSize:9,color:C.muted,fontFamily:"monospace",letterSpacing:2,display:"block",marginTop:-2}}>PRONOSTICS GRATUITS</span>
            </div>
          </div>
          <div style={{background:C.red,color:"#fff",fontSize:9,padding:"4px 9px",borderRadius:4,letterSpacing:2,animation:"pulse 2s infinite"}}>● LIVE</div>
        </div>
        <div onClick={()=>window.open(REGISTER_URL,"_blank")} style={{background:`linear-gradient(90deg,${C.red},${C.gold})`,borderRadius:8,padding:"9px 13px",display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer"}}>
          <span style={{color:"#fff",fontSize:12,fontFamily:"monospace",letterSpacing:1}}>🎁 BONUS 200% — CODE</span>
          <span style={{background:"rgba(255,255,255,.22)",color:"#fff",padding:"3px 10px",borderRadius:4,fontSize:13,letterSpacing:4}}>{PROMO_CODE}</span>
        </div>
      </div>

      {/* TABS */}
      <div style={{display:"flex",background:"#0d0d18",borderBottom:`1px solid ${C.border}`}}>
        {navItems.map(n=>(
          <div key={n.id} onClick={()=>setTab(n.id)} style={{flex:1,padding:"11px 2px",textAlign:"center",cursor:"pointer",fontSize:9,color:tab===n.id?C.red:C.dim,letterSpacing:1,fontFamily:"monospace",borderBottom:tab===n.id?`2px solid ${C.red}`:"2px solid transparent",transition:"all .2s"}}>
            {n.i} {n.l}
          </div>
        ))}
      </div>

      {/* SPORT FILTER */}
      {tab==="matches"&&(
        <div style={{display:"flex",background:"#0b0b14",borderBottom:`1px solid ${C.border}`,padding:"6px 10px",gap:8,overflowX:"auto"}}>
          {[{id:"all",l:"🔥 TOUS"},{id:"football",l:"⚽ FOOT"},{id:"basketball",l:"🏀 BASKET"},{id:"tennis",l:"🎾 TENNIS"}].map(f=>(
            <div key={f.id} onClick={()=>{setSport(f.id);setOpen(null);}} style={{padding:"6px 14px",borderRadius:20,fontSize:10,fontFamily:"monospace",letterSpacing:1,cursor:"pointer",background:sport===f.id?SC[f.id]||C.red:"#15151f",color:sport===f.id?"#fff":C.muted,border:`1px solid ${sport===f.id?SC[f.id]||C.red:C.border}`,transition:"all .2s",whiteSpace:"nowrap"}}>
              {f.l}
            </div>
          ))}
        </div>
      )}

      {/* ===== MATCHS ===== */}
      {tab==="matches"&&(
        <div style={{padding:"10px 11px 110px"}}>
          {loading?<div className="spinner"/>:filtered.length===0?(
            <div style={{textAlign:"center",padding:"40px 20px",color:C.muted,fontSize:12,fontFamily:"monospace"}}>
              <div style={{fontSize:40,marginBottom:12}}>📭</div>

            <>

              {filtered.map(m=><MatchCard key={m.id} m={m} open={open===m.id} onToggle={()=>setOpen(p=>p===m.id?null:m.id)}/>)}
            </>
          )}
          <CTA title="🎯 MISEZ SUR NOS PRONOSTICS" sub="INSCRIPTION GRATUITE — BONUS 200%"/>
        </div>
      )}

      {/* ===== RÉSULTATS ===== */}
      {tab==="results"&&(
        <div style={{padding:"10px 11px 110px"}}>
          <div style={{color:C.muted,fontSize:10,letterSpacing:3,fontFamily:"monospace",marginBottom:12,marginTop:14}}>🏆 COUPONS — 3 DERNIERS JOURS</div>
          {loading?<div className="spinner"/>:recent.length===0?(
            <div style={{textAlign:"center",padding:"40px 20px",color:C.muted,fontSize:12,fontFamily:"monospace"}}>
              <div style={{fontSize:40,marginBottom:12}}>📊</div>Aucun résultat sur les 3 derniers jours.
            </div>
          ):(
            <>
              <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap"}}>
                {[{l:`${recent.filter(c=>c.status==="won").length} Gagnés`,c:C.green},{l:`${recent.filter(c=>c.status==="lost").length} Perdus`,c:C.red},{l:`${recent.filter(c=>c.status==="pending").length} En attente`,c:C.gold}].map((b,i)=>(
                  <span key={i} style={{background:b.c+"22",color:b.c,border:`1px solid ${b.c}44`,borderRadius:20,padding:"4px 12px",fontSize:11,fontFamily:"monospace",fontWeight:700}}>{b.l}</span>
                ))}
              </div>
              {recent.map(c=>(
                <div key={c.id} style={{background:c.status==="won"?"linear-gradient(135deg,#0a1f0a,#111f11)":c.status==="lost"?"linear-gradient(135deg,#1f0a0a,#1f1111)":`linear-gradient(135deg,${C.card},#131323)`,border:`1px solid ${c.status==="won"?C.green+"44":c.status==="lost"?C.red+"44":C.border}`,borderRadius:12,padding:"12px 14px",marginBottom:10,animation:"slideUp .3s ease"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:6}}>
                    <div>
                      <span style={{fontSize:13,color:"#fff"}}>{SE[c.sport]} {c.home_team} vs {c.away_team}</span>
                      <span style={{display:"block",fontSize:10,color:C.muted,fontFamily:"monospace",marginTop:2}}>{c.league} • {fmt(c.match_date)}</span>
                    </div>
                    <span style={{background:c.status==="won"?C.green+"22":c.status==="lost"?C.red+"22":C.gold+"22",color:c.status==="won"?C.green:c.status==="lost"?C.red:C.gold,border:`1px solid ${c.status==="won"?C.green+"44":c.status==="lost"?C.red+"44":C.gold+"44"}`,borderRadius:20,padding:"3px 10px",fontSize:10,fontWeight:700,fontFamily:"monospace"}}>
                      {c.status==="won"?"✅ GAGNÉ":c.status==="lost"?"❌ PERDU":"⏳ EN COURS"}
                    </span>
                  </div>
                  <div style={{display:"flex",justifyContent:"space-between"}}>
                    <span style={{fontSize:12,color:C.gold,fontFamily:"monospace"}}>📋 {c.prediction}</span>
                    {c.odds&&<span style={{fontSize:14,color:C.gold,fontWeight:700}}>× {c.odds}</span>}
                  </div>
                  {c.note&&<p style={{fontSize:10,color:C.muted,fontFamily:"monospace",marginTop:6,borderLeft:`2px solid ${c.status==="won"?C.green:c.status==="lost"?C.red:C.gold}`,paddingLeft:8}}>{c.note}</p>}
                </div>
              ))}
            </>
          )}
          <CTA title="💰 REPRODUISEZ CES GAINS" sub="INSCRIVEZ-VOUS AVEC LE CODE PICSOUS"/>
        </div>
      )}

      {/* ===== ARTICLES ===== */}
      {tab==="articles"&&(
        <div style={{padding:"10px 11px 110px"}}>
          <div style={{color:C.muted,fontSize:10,letterSpacing:3,fontFamily:"monospace",marginBottom:12,marginTop:14}}>📰 NOS DERNIERS ARTICLES</div>
          {loading?<div className="spinner"/>:articles.length===0?(
            <div style={{textAlign:"center",padding:"40px 20px",color:C.muted,fontSize:12,fontFamily:"monospace"}}>
              <div style={{fontSize:40,marginBottom:12}}>✍️</div>Aucun article disponible. Revenez demain matin !
            </div>
          ):(
            articles.map(a=>(
              <div key={a.id} style={{background:`linear-gradient(135deg,${C.card},#131323)`,border:`1px solid ${C.border}`,borderRadius:12,padding:14,marginBottom:10,cursor:"pointer",animation:"slideUp .3s ease",transition:"border-color .2s"}}
                onMouseEnter={e=>e.currentTarget.style.borderColor=C.red}
                onMouseLeave={e=>e.currentTarget.style.borderColor=C.border}>
                <div style={{fontSize:16,color:"#fff",letterSpacing:1,marginBottom:6,lineHeight:1.3}}>{a.title}</div>
                <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
                  <span style={{background:(SC[a.sport]||C.gold)+"22",color:SC[a.sport]||C.gold,border:`1px solid ${SC[a.sport]||C.gold}44`,borderRadius:4,padding:"2px 8px",fontSize:9,fontFamily:"monospace",letterSpacing:1}}>{SE[a.sport]} {a.sport?.toUpperCase()}</span>
                  {(a.tags||[]).slice(0,2).map((t,i)=><span key={i} style={{background:C.blue+"22",color:C.blue,border:`1px solid ${C.blue}44`,borderRadius:4,padding:"2px 8px",fontSize:9,fontFamily:"monospace",letterSpacing:1}}>{t}</span>)}
                  <span style={{background:"#55555522",color:C.muted,border:"1px solid #44444444",borderRadius:4,padding:"2px 8px",fontSize:9,fontFamily:"monospace",letterSpacing:1}}>⏱ {a.read_time} min</span>
                </div>
                {a.intro&&<p style={{fontSize:11,color:C.muted,fontFamily:"monospace",lineHeight:1.5,marginTop:8}}>{a.intro.substring(0,120)}...</p>}
                <button onClick={()=>setOpenArt(a)} style={{display:"inline-block",marginTop:10,background:C.red,color:"#fff",border:"none",borderRadius:6,padding:"6px 14px",fontSize:10,fontFamily:"monospace",letterSpacing:2,cursor:"pointer"}}>LIRE L'ARTICLE →</button>
              </div>
            ))
          )}
        </div>
      )}

      {/* ===== PROMO ===== */}
      {tab==="promo"&&<PromoScreen/>}

      {/* BOTTOM NAV */}
      <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:430,background:"#090910",borderTop:`1px solid ${C.border}`,display:"flex",zIndex:200}}>
        {navItems.map(n=>(
          <div key={n.id} onClick={()=>setTab(n.id)} style={{flex:1,padding:"9px 4px 7px",textAlign:"center",cursor:"pointer",borderTop:tab===n.id?`2px solid ${C.red}`:"2px solid transparent"}}>
            <span style={{fontSize:17,display:"block",marginBottom:2,filter:tab===n.id?"none":"grayscale(1) opacity(.35)"}}>{n.i}</span>
            <span style={{fontSize:8,color:tab===n.id?C.red:"#444",letterSpacing:2,fontFamily:"monospace"}}>{n.l}</span>
          </div>
        ))}
      </div>

      <WAButton/>
    </div>
  );
}

function WAButton(){
  const [h,setH]=useState(false);
  return(
    <div onClick={()=>window.open(WHATSAPP_URL,"_blank")} onMouseEnter={()=>setH(true)} onMouseLeave={()=>setH(false)}
      title="Rejoindre le groupe WhatsApp"
      style={{position:"fixed",bottom:70,right:"calc(50% - 208px)",width:50,height:50,borderRadius:"50%",background:"#25d366",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",zIndex:300,boxShadow:"0 4px 20px rgba(37,211,102,.5)",border:"2px solid rgba(255,255,255,.15)",transition:"transform .2s",transform:h?"scale(1.12)":"scale(1)"}}>
      <svg width="26" height="26" viewBox="0 0 32 32" fill="none">
        <path d="M16 2C8.268 2 2 8.268 2 16c0 2.492.652 4.832 1.793 6.858L2 30l7.352-1.766A13.94 13.94 0 0016 30c7.732 0 14-6.268 14-14S23.732 2 16 2z" fill="#25D366"/>
        <path d="M22.507 19.562c-.31-.156-1.833-.905-2.117-1.008-.284-.103-.49-.154-.697.155-.207.309-.8 1.008-.98 1.215-.18.207-.36.232-.67.077-.31-.155-1.308-.482-2.49-1.537-.92-.822-1.542-1.836-1.722-2.146-.18-.31-.019-.477.135-.631.14-.139.31-.362.465-.543.155-.18.207-.31.31-.516.103-.207.052-.387-.026-.543-.077-.155-.697-1.68-.955-2.301-.251-.605-.507-.523-.697-.533l-.593-.01c-.207 0-.543.077-.827.387-.284.31-1.085 1.06-1.085 2.584 0 1.524 1.11 2.997 1.265 3.204.155.207 2.186 3.339 5.298 4.682.74.32 1.318.51 1.769.653.743.236 1.42.203 1.954.123.596-.09 1.833-.75 2.091-1.474.258-.724.258-1.344.18-1.474-.077-.129-.283-.206-.593-.361z" fill="#fff"/>
      </svg>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
